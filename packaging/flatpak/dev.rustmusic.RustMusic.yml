# Manifeste Flatpak de RustMusic (Flathub). Construit depuis les sources, hors ligne :
# dépendances Cargo listées dans cargo-sources.json (généré par
# packaging/flatpak/generer-sources.sh, à chaque version). Depuis la 0.5, plus de
# frontend web ni de Tauri : un seul binaire Rust, le projet Cargo à la racine.
id: dev.rustmusic.RustMusic
runtime: org.gnome.Platform
# Version du runtime GNOME : prendre la plus récente encore suivie (le linter refuse une version en fin de vie).
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: rustmusic

finish-args:
  # Fenêtre et affichage accéléré (karbon-ui : Wayland ou X11, Vulkan).
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Lecture partagée par le serveur son (PipeWire ou PulseAudio).
  - --socket=pulseaudio
  # Serveur DLNA, lecteurs UPnP et AirPlay, télécommande d'ampli, MusicBrainz, paroles.
  - --share=network
  # Bibliothèques musicales : dossier Musique et disques externes, en écriture pour les tags.
  - --filesystem=xdg-music
  - --filesystem=/media
  - --filesystem=/run/media
  - --filesystem=/mnt
  # Partages réseau montés par le gestionnaire de fichiers (SMB, SFTP…) : lus en direct.
  # Sinon le sélecteur passe par le portail de documents, une seconde couche FUSE
  # par-dessus GVFS (12 à 17 s pour précharger un FLAC sur un NAS).
  - --filesystem=xdg-run/gvfs
  # Contrôles média du bureau (MPRIS) et notifications de changement de morceau.
  - --own-name=org.mpris.MediaPlayer2.rustmusic
  - --talk-name=org.freedesktop.Notifications
  # Icône de la barre système (StatusNotifierItem), quand karbon-ui la proposera.
  - --talk-name=org.kde.StatusNotifierWatcher

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin

modules:
  - name: rustmusic
    buildsystem: simple
    build-options:
      # Pas les CFLAGS du SDK (-O2) : placés après le -O0 qu'exige aws-lc-sys pour
      # jitterentropy, ils font échouer sa compilation. cc-rs optimise déjà en release.
      cflags: ''
      cflags-override: true
      env:
        CARGO_HOME: /run/build/rustmusic/cargo
    build-commands:
      # karbon-ui est une dépendance par chemin (`../karbon-ui`) : à publier ou à
      # ajouter aux sources avant la prochaine version Flathub.
      - cargo --offline build --release
      - install -Dm755 target/release/rustmusic /app/bin/rustmusic
      - install -Dm644 packaging/flatpak/dev.rustmusic.RustMusic.desktop /app/share/applications/dev.rustmusic.RustMusic.desktop
      - install -Dm644 dev.rustmusic.RustMusic.metainfo.xml /app/share/metainfo/dev.rustmusic.RustMusic.metainfo.xml
      - install -Dm644 icons/icon-source.svg /app/share/icons/hicolor/scalable/apps/dev.rustmusic.RustMusic.svg
      - install -Dm644 icons/128x128.png /app/share/icons/hicolor/128x128/apps/dev.rustmusic.RustMusic.png
      - install -Dm644 icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/dev.rustmusic.RustMusic.png
      - install -Dm644 icons/icon.png /app/share/icons/hicolor/512x512/apps/dev.rustmusic.RustMusic.png
    sources:
      # Pour Flathub : la version publiée (tag + commit). Pour un essai, construire-local.sh
      # remplace cette source par le dossier de travail.
      - type: git
        url: https://github.com/larevuegeek/rustmusic-desktop.git
        tag: v0.4.1
        commit: 7042a173b66f28b1521be99f8e9e79f78d4a492c
      # La fiche AppStream vient d'à côté du manifeste, pas du tag : les notes d'une
      # version s'écrivent souvent après son tag.
      - type: file
        path: dev.rustmusic.RustMusic.metainfo.xml
      - cargo-sources.json
