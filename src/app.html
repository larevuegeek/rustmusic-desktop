<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RustMusic</title>
    <script>
      // Thème appliqué AVANT le premier rendu.
      //
      // La classe `dark` était écrite en dur sur <html> : chaque chargement
      // démarrait donc en sombre, et le thème réel n'arrivait qu'une fois
      // l'application démarrée, les réglages lus en base et l'autostart
      // vérifié. D'où l'écran qui « redevient sombre » à chaque rechargement,
      // parfois pendant plusieurs secondes.
      //
      // Ce script lit le dernier thème connu dans `localStorage` — synchrone,
      // disponible immédiatement — et pose la classe avant que quoi que ce
      // soit ne s'affiche. La base reste la source de vérité : elle corrigera
      // au chargement si les deux divergent, sans que personne ne le voie.
      (function () {
        try {
          var mode = localStorage.getItem("rustmusic:theme") || "auto";
          var dark =
            mode === "dark" ||
            (mode === "auto" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");

          if (localStorage.getItem("rustmusic:contrast") === "high") {
            document.documentElement.setAttribute("data-contrast", "high");
          }

          // Couleur d'accent choisie : nuances calculées au dernier lancement.
          var accent = JSON.parse(localStorage.getItem("rustmusic:accent") || "null");
          if (accent) {
            for (var k in accent) document.documentElement.style.setProperty(k, accent[k]);
            document.documentElement.setAttribute("data-accent", "");
          }
        } catch (e) {
          // Stockage indisponible : on laisse le thème clair, que la base
          // corrigera. Mieux vaut un bref passage en clair qu'un écran noir.
        }
      })();
    </script>
    <style>
      /* Fond du thème avant le chargement des styles : jamais d'écran blanc en sombre. */
      html { background: #f6f4ef; }
      html.dark { background: #0b0d0c; }

      /* Écran de chargement : visible dès l'ouverture, sans attendre le JavaScript. */
      #demarrage {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
        background: #f6f4ef; transition: opacity 0.25s ease;
      }
      .dark #demarrage { background: #0b0d0c; }
      #demarrage.fini { opacity: 0; pointer-events: none; }
      #demarrage .rm-vert { fill: var(--acc-600, #16a34a); }
      #demarrage .rm-texte { fill: #1a1c1a; }
      .dark #demarrage .rm-vert { fill: url(#rmDemarrage); }
      .dark #demarrage .rm-texte { fill: #f5f5f5; }
      #demarrage .anneau {
        width: 30px; height: 30px; border-radius: 50%;
        border: 3px solid color-mix(in srgb, var(--acc-600, #16a34a) 18%, transparent); border-top-color: var(--acc-600, #16a34a);
        animation: demarrage-tourne 0.8s linear infinite;
      }
      @keyframes demarrage-tourne { to { transform: rotate(360deg); } }
    </style>
    %sveltekit.head%
  </head>
  <body class="bg-white dark:bg-zinc-950" data-sveltekit-preload-data="hover">
    <div id="demarrage" aria-busy="true" aria-label="RustMusic">
      <svg width="190" viewBox="0 0 141 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="rmDemarrage" x1="0" y1="0" x2="28" y2="28" gradientUnits="userSpaceOnUse">
            <stop offset="0%" style="stop-color: var(--acc-400, #34d369)" /><stop offset="100%" style="stop-color: var(--acc-500, #22c55e)" />
          </linearGradient>
        </defs>
        <g transform="translate(1, 1)">
          <svg viewBox="0 0 256 256" width="26" height="26">
            <path class="rm-vert" d="M232 128v56a24 24 0 0 1-24 24h-16a24 24 0 0 1-24-24v-40a24 24 0 0 1 24-24h23.65a87.71 87.71 0 0 0-87-80H128a88 88 0 0 0-87.64 80H64a24 24 0 0 1 24 24v40a24 24 0 0 1-24 24H48a24 24 0 0 1-24-24v-56a104.11 104.11 0 0 1 177.89-73.34A103.4 103.4 0 0 1 232 128" />
          </svg>
        </g>
        <text x="30" y="21" font-family="Inter Variable, Inter, system-ui, sans-serif" font-size="22" font-weight="800" letter-spacing="-1.2"><tspan class="rm-texte">Rust</tspan><tspan class="rm-vert">Music</tspan></text>
      </svg>
      <div class="anneau"></div>
    </div>
    <div style="display: contents">
        %sveltekit.body%
    </div>
  </body>
</html>
