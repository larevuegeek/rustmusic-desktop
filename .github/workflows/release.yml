# Paquets de RustMusic pour Windows, macOS (universel : Apple Silicon et Intel) et Linux.
#
# - Étiquette `v*` (`git tag v0.5.0-beta.1 && git push origin v0.5.0-beta.1`) : paquets
#   signés (minisign), puis version GitHub en brouillon avec le manifeste des mises à jour
#   (`latest.json`, ou `latest-beta.json` pour une pré-version), à relire puis publier.
# - Essai : `git push origin v0.5:release-test` (ou Actions → Release → Run workflow, une
#   fois le fichier sur la branche par défaut) : paquets seuls, en artefacts du lancement,
#   rien n'est publié.
#
# Secrets : CARGO_PACKAGER_SIGN_PRIVATE_KEY et CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD
# (clé minisign des mises à jour) ; pour macOS, APPLE_CERTIFICATE (.p12 Developer ID
# Application en base64), APPLE_CERTIFICATE_PASSWORD, APPLE_API_KEY (contenu du .p8),
# APPLE_API_KEY_ID, APPLE_API_ISSUER et APPLE_TEAM_ID (signature et notarisation).
name: Release

on:
  push:
    tags: ["v*"]
    branches: ["release-test"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            builds: x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
            arch: x64
            formats: nsis
          # Un seul .dmg pour les deux processeurs : les deux compilations sont fusionnées
          # (`lipo`) avant d'emballer, signer et notariser une seule fois.
          - name: macOS universel
            os: macos-latest
            builds: aarch64-apple-darwin x86_64-apple-darwin
            target: universal-apple-darwin
            arch: universal
            formats: app,dmg
          # Ubuntu 22.04 : un paquet construit sur une distribution ancienne marche aussi
          # sur les récentes (glibc), pas l'inverse.
          - name: Linux
            os: ubuntu-22.04
            builds: x86_64-unknown-linux-gnu
            target: x86_64-unknown-linux-gnu
            arch: x86_64
            formats: deb,appimage
    steps:
      - uses: actions/checkout@v4

      - name: Version de l'étiquette et du Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$crate" != "$tag" ]; then
            echo "::error::L'étiquette ($tag) ne correspond pas à la version du Cargo.toml ($crate)"
            exit 1
          fi

      - name: Cibles Rust
        id: targets
        shell: bash
        run: echo "list=$(echo '${{ matrix.builds }}' | tr ' ' ',')" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ steps.targets.outputs.list }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Bibliothèques de développement (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libasound2-dev libcairo2-dev \
            libpango1.0-dev libgdk-pixbuf-2.0-dev libglib2.0-dev \
            libfontconfig1-dev libfreetype6-dev libwayland-dev libxkbcommon-dev \
            libdbus-1-dev libfuse2

      - name: Outils d'emballage
        shell: bash
        run: |
          cargo install cargo-packager --locked --version 0.11.8
          if [ "$RUNNER_OS" = "Linux" ]; then
            cargo install cargo-generate-rpm --locked --version 0.21.1
          fi

      # Sans `--locked` : le Cargo.lock commité peut venir d'une copie de travail où karbon-ui
      # est pris en local (`.cargo/config.toml`, sans source crates.io) ; cargo ne complète
      # alors que cette source, les autres dépendances restent celles du Cargo.lock.
      - name: Compilation
        shell: bash
        run: |
          for target in ${{ matrix.builds }}; do
            cargo build --release --target "$target"
          done
          if [ "${{ matrix.target }}" = "universal-apple-darwin" ]; then
            mkdir -p target/universal-apple-darwin/release
            lipo -create -output target/universal-apple-darwin/release/rustmusic \
              target/aarch64-apple-darwin/release/rustmusic \
              target/x86_64-apple-darwin/release/rustmusic
            lipo -info target/universal-apple-darwin/release/rustmusic
          fi

      # La clé du secret, nettoyée (espaces et sauts de ligne d'un copier-coller) dans un
      # fichier, puis vérifiée : base64 d'une clé minisign. Rien de la clé n'est affiché.
      - name: Clé de signature des mises à jour
        shell: bash
        env:
          KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        run: |
          file="$RUNNER_TEMP/rustmusic.key"
          printf '%s' "$KEY" | tr -d ' \r\n\t' > "$file"
          length=$(wc -c < "$file" | tr -d ' ')
          if [ "$length" -eq 0 ]; then
            echo "::error::Secret CARGO_PACKAGER_SIGN_PRIVATE_KEY vide ou absent"
            exit 1
          fi
          # Décodage complet et strict (un secret tronqué, sans ses « == » finaux, passerait
          # un simple coup d'œil au début).
          expected="attendu : le contenu de keys/rustmusic.key, une ligne de 348 caractères finissant par =="
          if ! base64 -d < "$file" > "$RUNNER_TEMP/rustmusic.key.txt" 2>/dev/null; then
            echo "::error::Secret CARGO_PACKAGER_SIGN_PRIVATE_KEY : base64 invalide ($length caractères ; $expected)"
            exit 1
          fi
          header=$(head -c 17 "$RUNNER_TEMP/rustmusic.key.txt")
          lines=$(grep -c . "$RUNNER_TEMP/rustmusic.key.txt" || true)
          rm -f "$RUNNER_TEMP/rustmusic.key.txt"
          if [ "$header" != "untrusted comment" ] || [ "$lines" -ne 2 ] || [ "$length" -ne 348 ]; then
            echo "::error::Secret CARGO_PACKAGER_SIGN_PRIVATE_KEY incomplet ou d'un autre format ($length caractères ; $expected)"
            exit 1
          fi
          if [ -z "${KEY_PASSWORD}" ]; then
            echo "::error::Secret CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD absent : la clé est protégée par un mot de passe"
            exit 1
          fi
          echo "Clé de signature : $length caractères, clé minisign lisible"
          echo "SIGN_KEY_FILE=$file" >> "$GITHUB_ENV"

      # Notarisation : cargo-packager attend l'identifiant de la clé API dans APPLE_API_KEY
      # et le fichier .p8 dans APPLE_API_KEY_PATH ; le secret APPLE_API_KEY en est le contenu.
      - name: Clé API de notarisation (macOS)
        if: runner.os == 'macOS'
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "::error::Secret APPLE_API_KEY absent (contenu du fichier AuthKey_….p8)"
            exit 1
          fi
          file="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$API_KEY" > "$file"
          if ! grep -q "BEGIN PRIVATE KEY" "$file"; then
            echo "::error::Secret APPLE_API_KEY : attendu le contenu du .p8, lignes BEGIN et END PRIVATE KEY comprises"
            exit 1
          fi
          echo "APPLE_API_KEY_PATH=$file" >> "$GITHUB_ENV"

      # Sous macOS : signature Developer ID (trousseau temporaire créé depuis APPLE_CERTIFICATE)
      # et notarisation de l'appli par Apple, avant la signature minisign des paquets.
      - name: Paquets
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ env.SIGN_KEY_FILE }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Formats choisis : sans eux, cargo-packager ajoute sous Linux un paquet pacman
        # (PKGBUILD et .tar.gz) qu'on ne distribue pas.
        run: cargo packager --release --target ${{ matrix.target }} --formats ${{ matrix.formats }}

      # .rpm (Fedora, openSUSE) : cargo-packager n'en fabrique pas. Paquet « rust-music »
      # comme en 0.4, pour la mettre à jour ; « - » interdit dans une version RPM, une
      # pré-version s'écrit « 0.5.0~beta.1 » (classée avant la 0.5.0).
      - name: Paquet RPM (Linux)
        if: runner.os == 'Linux'
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ env.SIGN_KEY_FILE }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          cargo generate-rpm --target ${{ matrix.target }} -s "version = \"${version//-/\~}\"" -o target/packages/
          for rpm in target/packages/*.rpm; do
            cargo packager signer sign "$rpm"
          done

      # Preuve dans le journal : signature valide, notarisation agrafée, appli acceptée par
      # Gatekeeper comme une appli téléchargée, binaire pour les deux processeurs.
      - name: Vérification de la signature (macOS)
        if: runner.os == 'macOS'
        run: |
          app=target/packages/RustMusic.app
          lipo -info "$app/Contents/MacOS/rustmusic"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Rassemblement des paquets
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          mkdir -p dist
          # Fichiers de premier niveau : installeurs, images disque, archives et signatures
          # (pas le dossier .app ni les fichiers de travail).
          find target/packages -maxdepth 1 -type f -exec cp {} dist/ \;
          # Archive de mise à jour macOS : nom avec la version et l'architecture (la
          # signature porte sur le contenu, pas sur le nom).
          for f in dist/*.app.tar.gz dist/*.app.tar.gz.sig; do
            [ -e "$f" ] || continue
            mv "$f" "${f/.app.tar.gz/_${version}_${{ matrix.arch }}.app.tar.gz}"
          done
          # « ~ » d'une pré-version RPM : remplacé dans le nom du fichier seulement (GitHub
          # peut renommer ce caractère, ce qui casserait l'adresse du manifeste).
          for f in dist/*~*; do
            [ -e "$f" ] || continue
            mv "$f" "${f//\~/-}"
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: rustmusic-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Version GitHub (brouillon)
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Manifeste des mises à jour
        run: python3 .github/scripts/updater_manifest.py dist "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"

      - name: Notes de version
        run: |
          python3 - <<'EOF'
          import json, pathlib
          manifest = next(pathlib.Path("dist").glob("latest*.json"))
          pathlib.Path("notes.md").write_text(json.loads(manifest.read_text())["notes"], encoding="utf-8")
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: RustMusic ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true
