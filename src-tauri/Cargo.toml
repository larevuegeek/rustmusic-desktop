[package]
name = "rustmusic"
version = "0.2.5"
description = "Audiophile-grade desktop music player with native DSD playback, multichannel SACD support, DLNA server, synced lyrics, and OS media controls."
authors = ["LaRevueGeeK <contact@rustmusic.dev>"]
edition = "2021"
license = "GPL-3.0-only"
homepage = "https://rustmusic.dev"
repository = "https://github.com/larevuegeek/rustmusic-desktop"
readme = "../README.md"
keywords = ["music-player", "dsd", "audiophile", "tauri", "hi-fi"]
categories = ["multimedia::audio"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rustmusic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2.4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
base64 = "0.22.1"
cpal = "0.18.1"
# 0.6 : flac/wav/vorbis/pcm sont dans les features par défaut ; isomp4 ajoute
# le conteneur MP4/M4A (sans lui le codec AAC ne sert à rien en pratique).
symphonia = { version = "0.6.0", features = ["mp3", "flac", "wav", "vorbis", "aac", "isomp4"] }
rubato = "3.0.0"
lazy_static = "1.5.0"
log = "0.4.33"
simplelog = "0.12"
# Déjà dans l'arbre via simplelog ; en dépendance directe pour la macro
# `format_description!`, qui vérifie le format d'horodatage à la compilation.
time = { version = "0.3", features = ["macros", "local-offset"] }
rb = "0.4.1"
arrayvec = "0.7.8"
num-traits = "0.2.19"
anyhow = "1.0.103"
md5 = "0.8.1"
# NB: rester aligné sur la version qu'utilise rubato (4.0 existe mais rubato 3 attend les traits 3.x)
audioadapter-buffers = "3.0.0"
sqlx = { version = "0.8.6", features = [
    "runtime-tokio",      # Runtime async
    "sqlite",             # Driver SQLite
    "macros",             # Pour query!() macro
    "chrono"
] }
tokio = { version = "1.52.3", features = ["full"] }
dirs = "6.0.0"
uuid = { version = "1.23.4", features = ["v4", "serde"] }
unidecode = "0.3.0"
chrono = { version = "0.4.45", features = ["serde"] }
ringbuf = "0.5.0"
regex = "1.13.0"
rayon = "1.12.0"
reqwest = { version = "0.13.4", features = ["json"] }
urlencoding = "2"
tauri-plugin-updater = "2.10.1"
image = "0.25.10"
fast_image_resize = { version = "6.0", default-features = false, features = ["image"] }
num_cpus = "1.17.0"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7.0", features = ["fs"] }
async-trait = "0.1"
souvlaki = "0.8"
tauri-plugin-window-state = "2.4.1"

# WASAPI exclusive mode (Windows uniquement) — bit-perfect, bypass mixer
# Windows. Activable via Réglages → Audio → "WASAPI exclusive". Sur les
# autres OS ce crate n'est pas compilé.
[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.23"

# CoreAudio direct pour le DoP bit-perfect sur macOS. On ne réimplémente PAS
# le stream (CPAL suffit : son unité HAL règle déjà le rate nominal du device et
# ne rééchantillonne pas) ; ces crates servent au *hors-bande* que CPAL n'expose
# pas : énumération des AudioDeviceID, rates nominaux disponibles, et surtout
# le **hog mode** (accès exclusif, équivalent macOS du WASAPI exclusive).
# Versions alignées sur celles que CPAL 0.18 tire déjà → aucun crate en plus.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = "0.3"

# ALSA direct (hw:) pour le DoP bit-perfect sur Linux (bypass PipeWire/Pulse).
# Nécessite libasound2-dev au build.
[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.11"
# Accès direct au WebView WebKitGTK (via WebviewWindow::with_webview) pour
# écouter le signal `web-process-terminated` : détection du crash du processus
# de rendu (EGL/DMABUF, mix AppImage/libs hôte) → fallback rendu logiciel.
# Version épinglée sur celle que wry (Tauri) tire déjà → aucun crate en plus.
# v2_20 = version mini du signal ; wry active de toute façon des features
# plus récentes.
webkit2gtk = { version = "=2.0.2", features = ["v2_20"] }
# Réservation de carte audio via org.freedesktop.ReserveDevice1 (D-Bus) pour
# que PipeWire/Pulse libère le `hw:` avant le DoP exclusif. Version alignée sur
# l'arbre existant (contrôles média).
zbus = "5"

[profile.release]
strip = false
lto = true
